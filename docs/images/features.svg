<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Quillume preset collections</title><desc id="desc">10 writing angles, 10 creator voices, 10 reader profiles, 10 styles, 12 editing methods, and 7 refinement tools. All can be customized.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b8e0cd"/></marker></defs><rect width="1200" height="680" rx="24" fill="#101c28"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="60" y="62" font-size="14" fill="#b8e0cd" font-weight="700">03 / FEATURES</text><text x="60" y="119" font-size="38" fill="#f7f3e8" font-weight="700">A writing toolkit you can make your own.</text><text x="60" y="155" font-size="19" fill="#a6b6c5" font-weight="400">59 presets across six collections. Every collection accepts custom guidance.</text><rect x="60" y="210" width="346" height="152" rx="18" fill="#192a39" stroke="#304352"/><text x="84" y="258" font-size="36" fill="#efc785" font-weight="700">10</text><text x="84" y="296" font-size="23" fill="#f7f3e8" font-weight="600">Writing angles</text><text x="84" y="330" font-size="16" fill="#a6b6c5" font-weight="400">Rewrites, explanations, threads</text><rect x="429" y="210" width="346" height="152" rx="18" fill="#192a39" stroke="#304352"/><text x="453" y="258" font-size="36" fill="#efc785" font-weight="700">10</text><text x="453" y="296" font-size="23" fill="#f7f3e8" font-weight="600">Creator voices</text><text x="453" y="330" font-size="16" fill="#a6b6c5" font-weight="400">Editable editorial perspectives</text><rect x="798" y="210" width="346" height="152" rx="18" fill="#192a39" stroke="#304352"/><text x="822" y="258" font-size="36" fill="#efc785" font-weight="700">10</text><text x="822" y="296" font-size="23" fill="#f7f3e8" font-weight="600">Reader profiles</text><text x="822" y="330" font-size="16" fill="#a6b6c5" font-weight="400">Adapt depth to the intended reader</text><rect x="60" y="387" width="346" height="152" rx="18" fill="#192a39" stroke="#304352"/><text x="84" y="435" font-size="36" fill="#efc785" font-weight="700">10</text><text x="84" y="473" font-size="23" fill="#f7f3e8" font-weight="600">Voice &amp; style</text><text x="84" y="507" font-size="16" fill="#a6b6c5" font-weight="400">Plain, professional, conversational</text><rect x="429" y="387" width="346" height="152" rx="18" fill="#192a39" stroke="#304352"/><text x="453" y="435" font-size="36" fill="#efc785" font-weight="700">12</text><text x="453" y="473" font-size="23" fill="#f7f3e8" font-weight="600">Editing methods</text><text x="453" y="507" font-size="16" fill="#a6b6c5" font-weight="400">Cut clutter, match voice, check claims</text><rect x="798" y="387" width="346" height="152" rx="18" fill="#192a39" stroke="#304352"/><text x="822" y="435" font-size="36" fill="#efc785" font-weight="700">07</text><text x="822" y="473" font-size="23" fill="#f7f3e8" font-weight="600">Refinement tools</text><text x="822" y="507" font-size="16" fill="#a6b6c5" font-weight="400">Titles, reviews, format adaptations</text><text x="60" y="624" font-size="22" fill="#b8e0cd" font-weight="600">10 angles × 10 creator voices × 10 readers = 1,000 core combinations</text></g></svg>