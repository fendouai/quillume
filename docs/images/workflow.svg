<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Quillume writing workflow</title><desc id="desc">Supply source text, choose an editorial setup, draft with your host agent, review factual fidelity, then deliver the draft or editing report.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b8e0cd"/></marker></defs><rect width="1200" height="680" rx="24" fill="#101c28"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="60" y="62" font-size="14" fill="#b8e0cd" font-weight="700">02 / WORKFLOW</text><text x="60" y="119" font-size="38" fill="#f7f3e8" font-weight="700">From a rough note to a useful draft.</text><text x="60" y="155" font-size="19" fill="#a6b6c5" font-weight="400">Start with evidence. Add only the editorial choices your task needs.</text><rect x="60" y="239" width="250" height="238" rx="18" fill="#192a39" stroke="#304352"/><text x="84" y="289" font-size="34" fill="#efc785" font-weight="700">01</text><text x="84" y="335" font-size="17" fill="#b8e0cd" font-weight="700">SOURCE</text><text x="84" y="378" font-size="18" fill="#f7f3e8" font-weight="600">Paste original notes</text><text x="84" y="415" font-size="16" fill="#a6b6c5" font-weight="400">Facts, numbers, caveats</text><path d="M312 355 L335 355" stroke="#b8e0cd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="338" y="239" width="250" height="238" rx="18" fill="#192a39" stroke="#304352"/><text x="362" y="289" font-size="34" fill="#efc785" font-weight="700">02</text><text x="362" y="335" font-size="17" fill="#b8e0cd" font-weight="700">SETUP</text><text x="362" y="378" font-size="18" fill="#f7f3e8" font-weight="600">Choose angle &amp; style</text><text x="362" y="415" font-size="16" fill="#a6b6c5" font-weight="400">Voice / reader optional</text><path d="M590 355 L613 355" stroke="#b8e0cd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="616" y="239" width="250" height="238" rx="18" fill="#192a39" stroke="#304352"/><text x="640" y="289" font-size="34" fill="#efc785" font-weight="700">03</text><text x="640" y="335" font-size="17" fill="#b8e0cd" font-weight="700">DRAFT</text><text x="640" y="378" font-size="18" fill="#f7f3e8" font-weight="600">Use your host agent</text><text x="640" y="415" font-size="16" fill="#a6b6c5" font-weight="400">Generate in English</text><path d="M868 355 L891 355" stroke="#b8e0cd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="894" y="239" width="250" height="238" rx="18" fill="#192a39" stroke="#304352"/><text x="918" y="289" font-size="34" fill="#efc785" font-weight="700">04</text><text x="918" y="335" font-size="17" fill="#b8e0cd" font-weight="700">REVIEW</text><text x="918" y="378" font-size="18" fill="#f7f3e8" font-weight="600">Compare with source</text><text x="918" y="415" font-size="16" fill="#a6b6c5" font-weight="400">Check claims &amp; scope</text><rect x="60" y="524" width="1084" height="87" rx="18" fill="#192a39" stroke="#304352"/><text x="86" y="560" font-size="14" fill="#b8e0cd" font-weight="700">DELIVER</text><text x="86" y="589" font-size="20" fill="#f7f3e8" font-weight="400">A draft or editing report that keeps the original meaning and qualifications.</text></g></svg>