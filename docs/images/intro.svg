<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Quillume — clear English from your original notes</title><desc id="desc">59 editable presets, 1000 angle/creator/reader combinations, and a dependency-free offline Python helper. Drafting uses the host agent model.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b8e0cd"/></marker></defs><rect width="1200" height="580" rx="24" fill="#101c28"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="60" y="67" font-size="14" fill="#b8e0cd" font-weight="700">WARMQUANT  /  AGENT SKILL</text><text x="60" y="161" font-size="80" fill="#f7f3e8" font-weight="700">Quillume</text><text x="63" y="211" font-size="25" fill="#efc785" font-weight="400">Your ideas. Your voice. A little more light.</text><text x="63" y="270" font-size="32" fill="#f7f3e8" font-weight="600">Turn rough notes into clear English.</text><text x="63" y="311" font-size="20" fill="#a6b6c5" font-weight="400">Choose the angle. Shape the voice. Keep the facts.</text><text x="63" y="417" font-size="44" fill="#b8e0cd" font-weight="700">59</text><text x="63" y="450" font-size="17" fill="#a6b6c5" font-weight="400">editable presets</text><text x="302" y="417" font-size="44" fill="#b8e0cd" font-weight="700">1,000</text><text x="302" y="450" font-size="17" fill="#a6b6c5" font-weight="400">core combinations</text><text x="560" y="417" font-size="44" fill="#b8e0cd" font-weight="700">0</text><text x="560" y="450" font-size="17" fill="#a6b6c5" font-weight="400">Python dependencies</text><rect x="843" y="105" width="294" height="369" rx="18" fill="#192a39" stroke="#304352"/><text x="871" y="147" font-size="13" fill="#efc785" font-weight="700">FROM NOTE TO DRAFT</text><text x="871" y="196" font-size="20" fill="#f7f3e8" font-weight="600">Original source</text><path d="M885 209 L885 241" stroke="#b8e0cd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="871" y="267" font-size="20" fill="#f7f3e8" font-weight="600">Editorial setup</text><path d="M885 280 L885 312" stroke="#b8e0cd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="871" y="338" font-size="20" fill="#f7f3e8" font-weight="600">Your agent</text><path d="M885 351 L885 383" stroke="#b8e0cd" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="871" y="409" font-size="20" fill="#f7f3e8" font-weight="600">Reviewed draft</text><text x="63" y="533" font-size="17" fill="#a6b6c5" font-weight="400">Uses your host model  ·  Offline helper  ·  MIT licensed</text></g></svg>